<div class="help-backdrop" *ngIf="isOpen" (click)="closeModal()">
  <div class="help-modal-container" (click)="$event.stopPropagation()">
    <header class="help-header">
      <div class="help-header-title">
        <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 16a1 1 0 1 1 1-1 1 1 0 0 1-1 1zm1-5.16A1.5 1.5 0 0 0 12 11a1 1 0 0 1-2 0 3.5 3.5 0 1 1 5 3.16z"/>
        </svg>
        <span>Справочный центр Topos GIS</span>
      </div>
      <button class="close-btn" (click)="closeModal()" aria-label="Закрыть справку">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </header>

    <div class="help-body">
      <aside class="help-sidebar">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="M21 21l-4.35-4.35"/>
          </svg>
          <input 
            type="text" 
            placeholder="Поиск по разделам..." 
            [ngModel]="searchQuery()" 
            (ngModelChange)="searchQuery.set($event)"
          />
        </div>

        <nav class="chapters-nav">
          <div class="nav-section-title">Разделы руководства</div>
          <button 
            *ngFor="let ch of filteredChapters" 
            class="chapter-btn" 
            [class.active]="ch.id === activeChapterId()"
            (click)="selectChapter(ch.id)"
          >
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
            <span class="chapter-title-text">{{ ch.title }}</span>
          </button>
        </nav>

        <div class="toc-container" *ngIf="tocItems().length > 0">
          <div class="toc-title">Содержание главы</div>
          <div 
            *ngFor="let item of tocItems()" 
            class="toc-item"
            [class.toc-h3]="item.level === 3"
            (click)="scrollToToc(item.id)"
          >
            {{ item.text }}
          </div>
        </div>
      </aside>

      <main class="help-content-area">
        <div *ngIf="isLoading()" class="loading-state">
          <div class="spinner"></div>
          <span>Загрузка материалов...</span>
        </div>

        <article *ngIf="!isLoading()" class="markdown-rendered-body" [innerHTML]="renderedHtml()">
        </article>
      </main>
    </div>

    <footer class="help-footer">
      <div class="hotkey-tip">
        <svg class="tip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M6 12h.01M18 12h.01M8 16h8"/>
        </svg>
        <span>Подсказка: нажимайте <kbd>F1</kbd> в любой момент работы для быстрого открытия справки.</span>
      </div>
      <button class="primary-close-btn" (click)="closeModal()">Понятно</button>
    </footer>
  </div>
</div>
