<div class="place-search-wrapper">
  <div class="search-input-box">
    <svg class="search-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8" />
      <line x1="21" y1="21" x2="16.65" y2="16.65" />
    </svg>
    
    <input 
      type="text" 
      [ngModel]="searchQuery()" 
      (ngModelChange)="onInput($event)"
      [placeholder]="placeholder()" 
    />

    @if (searchQuery()) {
      <button class="clear-btn" (click)="clearSearch()">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    }
  </div>

  @if (isOpen() && searchResults().length > 0) {
    <div class="search-dropdown">
      @for (place of searchResults(); track place.id) {
        <button class="dropdown-item" (click)="onSelect(place)">
          <svg class="item-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
            <circle cx="12" cy="10" r="3" />
          </svg>
          
          <div class="item-info">
            <div class="item-name-row">
              @if (formatPlaceType(place.type)) {
                <span class="item-type-tag">{{ formatPlaceType(place.type) }}</span>
              }
              <span class="item-name">{{ place.name }}</span>
              @if (place.nameBe && place.nameBe !== place.name) {
                <span class="item-be">({{ place.nameBe }})</span>
              }
            </div>
            @if (place.region) {
              <span class="item-region">{{ place.region }}</span>
            }
          </div>
        </button>
      }
    </div>
  }
</div>
